# Static hosting for the Vite production build (frontend/dist).
# Used only by the `prod` stage of frontend/Dockerfile.
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Long-cache Vite's content-hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML entrypoint so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history fallback: unknown paths are handled client-side by react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
